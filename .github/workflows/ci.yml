name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux per the design (headless CI); Windows because that's the host.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Doctor smoke test
        # No credentials in CI, so credentials FAIL is expected; the command
        # must still run and print a report.
        shell: bash
        run: |
          set +e
          uv run ace doctor --offline | tee doctor.txt
          grep -q '\[OK  \] config' doctor.txt

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project python scripts/check_secrets.py $(git ls-files)
