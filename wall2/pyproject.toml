[project]
name = "wall2"
version = "0.1.0"
description = "Automated 0DTE options trend-pullback bot for Webull"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "exchange-calendars>=4.5",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7", "qasync>=0.27", "pyqtgraph>=0.13"]

[project.scripts]
wall2 = "wall2.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wall2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["wall2"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*", "pandas", "pyqtgraph", "pyqtgraph.*", "qasync"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/wall2/charts/svg.py" = ["E501"]  # SVG markup in f-strings
